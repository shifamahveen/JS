<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    
    <script>
        let arr = [1, 2, 3, 4];
        const result = arr.reduce((sum, i) => sum+i, 0)
        console.log(result);    // 10
        
        console.log(arr.reduce((acc, num) => acc*num, 1));  // 24
    </script>
</body>
