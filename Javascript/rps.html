<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./rps.css">
</head>
<body>
    <section id="container">
        <h1>Rock Paper Scissors</h1>

        <div class="choices">
            <div class="choice" onclick="rps('rock')">
                <img src="./rock.jpg" width="120px" alt="">
                <p>ROCK</p>
            </div>
            <div class="choice" onclick="rps('paper')">
                <img src="./paper.jpg" width="120px" alt="">
                <p>PAPER</p>
            </div>
            <div class="choice" onclick="rps('scissors')">
                <img src="./scissors.jpg" width="120px" alt="">
                <p>SCISSORS</p>
            </div>
        </div>

        <h2>Computer Choice: <span id="computer"></span></h2>
        <h2>Your Choice: <span id="user"></span></h2>
        <h2>Result: <span id="result"></span></h2>
    </section>

    <script src="./game.js"></script>
</body>
</html>
